name: Update music video list

on:
  schedule:
    - cron: "17 7 * * *"  # once a day
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-videos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      # Genius is asked through Albumscape's lookup service (albumscape.vercel.app/api/genius), which holds the token,
      # so no secret is needed here. YT_API_KEY is optional: it only covers songs Genius has no verified video for.
      - name: Look up new chart songs (Genius first, YouTube search only for what's left)
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python tools/update_videos.py
      - name: Save the list
        run: |
          git config user.name "albumscape-bot"
          git config user.email "albumscape-bot@users.noreply.github.com"
          git add videos.json
          git diff --cached --quiet || git commit -m "Update music video list"
          git push
