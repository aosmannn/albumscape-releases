<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="160" height="160">
  <title>Albumscape</title>
  <style>
    .out  { animation: slide 6s cubic-bezier(.2,.7,.2,1) infinite; }
    .spin { transform-origin: 48px 32px; animation: spin 2.4s linear infinite; }
    .tone { animation: tone 6s ease-in-out infinite; }
    @keyframes slide { 0%, 8% { transform: translateX(-20px); } 30%, 72% { transform: translateX(0); } 94%, 100% { transform: translateX(-20px); } }
    @keyframes spin  { to { transform: rotate(360deg); } }
    @keyframes tone  { 0%, 8% { fill: #A39A8A; } 30%, 72% { fill: #E2412F; } 94%, 100% { fill: #A39A8A; } }
    @media (prefers-reduced-motion: reduce) { .out, .spin, .tone { animation: none; } .out { transform: translateX(0); } }
  </style>
  <rect width="64" height="64" rx="12" fill="#13110F"/>
  <g class="out">
    <circle cx="48" cy="32" r="14" fill="#0B0A09" stroke="#EDE4D3" stroke-width="1.5"/>
    <g class="spin">
      <circle cx="48" cy="32" r="9.5" fill="none" stroke="#EDE4D3" stroke-opacity=".3"/>
      <path d="M48 19.5A12.5 12.5 0 0 1 60.5 32" fill="none" stroke="#EDE4D3" stroke-opacity=".55" stroke-width="1.2" stroke-linecap="round"/>
      <circle class="tone" cx="48" cy="32" r="4.5"/>
      <circle cx="48" cy="29" r=".9" fill="#13110F"/>
    </g>
    <circle cx="48" cy="32" r="1.1" fill="#13110F"/>
  </g>
  <rect x="7" y="14" width="36" height="36" fill="#EDE4D3"/>
  <rect x="12" y="41" width="13" height="3" fill="#13110F"/>
</svg>
